# Configuration file for Smart Traffic Management System

model:
  path: "yolov8n.pt"
  detected_classes: ["car", "bus", "truck", "motorcycle", "ambulance", "fire truck"]
  emergency_classes: ["ambulance", "fire truck"]

video:
  source: "highway.mp4"
  width: 1020
  height: 600
  frame_skip: 3 # Process every 3rd frame

lanes:
  lane1:
    polygon: [[50, 400], [50, 580], [500, 580], [500, 400]]
    capacity: 25
  lane2:
    polygon: [[550, 400], [550, 580], [980, 580], [980, 400]]
    capacity: 25

thresholds:
  density:
    low: 0.3
    medium: 0.7

timing:
  yellow_time: 10
  min_green: 15
  max_green: 60
  emergency_green: 60
